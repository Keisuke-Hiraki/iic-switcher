<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IIC Switcher 設定</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="options-view">
    <main class="app">
      <header class="header">
        <div>
          <h1>IIC Switcher 設定</h1>
          <p>登録・更新など一覧以外の設定はこちらで管理します。</p>
        </div>
      </header>

      <nav class="navbar" role="tablist" aria-label="設定操作">
        <button class="navbar-item is-active" id="tab-list" role="tab" aria-selected="true" type="button">
          登録済み
        </button>
        <button class="navbar-item" id="tab-add" role="tab" aria-selected="false" type="button">
          追加・編集
        </button>
        <button class="navbar-item" id="tab-permission" role="tab" aria-selected="false" type="button">
          許可セット
        </button>
        <button class="navbar-item" id="tab-import" role="tab" aria-selected="false" type="button">
          インポート/エクスポート
        </button>
      </nav>

      <section class="card list-card" id="panel-list" role="tabpanel" aria-labelledby="tab-list">
        <div class="list-header">
          <h2>登録済みポータル</h2>
          <div class="list-actions">
            <span id="portal-count">0</span>
            <button type="button" class="ghost" id="toggle-reorder">並び替え</button>
          </div>
        </div>
        <ul id="portal-list" class="portal-list"></ul>
        <p id="empty-state" class="empty">まだ登録されていません。</p>
      </section>

      <section class="card" id="panel-form" role="tabpanel" aria-labelledby="tab-add" hidden>
        <h2 id="form-title">ポータルを追加</h2>
        <form id="portal-form">
          <label>
            表示名
            <input id="portal-name" name="name" placeholder="例: 本番アカウント" required />
          </label>
          <label>
            アクセスポータルURL
            <input
              id="portal-url"
              name="url"
              placeholder="例: https://d-xxxxx.awsapps.com/start"
              required
            />
          </label>
          <div class="form-actions">
            <button type="submit" id="submit-button">追加</button>
            <button type="button" class="ghost" id="cancel-edit" hidden>キャンセル</button>
          </div>
          <p class="helper" id="form-helper" role="alert"></p>
        </form>
      </section>

      <section class="card" id="panel-permission" role="tabpanel" aria-labelledby="tab-permission" hidden>
        <h2 id="permission-title">許可セットを追加</h2>
        <form id="permission-form">
          <label>
            対象ポータル
            <select id="permission-portal" name="portal"></select>
          </label>
          <label>
            アカウントID
            <input
              id="permission-account"
              name="accountId"
              placeholder="例: 123456789012"
              inputmode="numeric"
              pattern="[0-9]{12}"
              required
            />
          </label>
          <label>
            アカウント名
            <input id="permission-account-name" name="accountName" placeholder="例: production" required />
          </label>
          <label>
            許可セット名
            <input id="permission-role" name="roleName" placeholder="例: AdministratorAccess" required />
          </label>
          <label>
            メモ (任意)
            <textarea id="permission-note" name="note" placeholder="例: 会計チームのみ利用"></textarea>
          </label>
          <div class="form-actions">
            <button type="submit" id="permission-submit">追加</button>
            <button type="button" class="ghost" id="permission-clear">クリア</button>
            <button type="button" class="ghost" id="permission-cancel" hidden>キャンセル</button>
          </div>
          <p class="helper" id="permission-helper" role="alert"></p>
        </form>
        <div class="permission-list-wrapper">
          <h3>登録済み許可セット</h3>
          <ul id="permission-list" class="permission-list"></ul>
          <p id="permission-empty" class="empty">まだ登録されていません。</p>
        </div>
      </section>

      <section class="card" id="panel-import" role="tabpanel" aria-labelledby="tab-import" hidden>
        <h2>インポート/エクスポート</h2>
        <div class="import-export">
          <div class="import-block">
            <h3>JSONインポート</h3>
            <textarea
              id="import-json"
              placeholder='{"portals":[{"name":"本番","url":"https://d-xxxxx.awsapps.com/start"}],"permissionSets":[{"portalUrl":"https://d-xxxxx.awsapps.com/start","accountId":"123456789012","accountName":"production","roleName":"Admin","note":"会計チーム"}]}'
            ></textarea>
            <button type="button" id="import-button">インポート</button>
            <p class="helper" id="import-helper" role="alert"></p>
          </div>
          <div class="export-block">
            <h3>JSONエクスポート</h3>
            <textarea id="export-json" readonly></textarea>
            <div class="form-actions">
              <button type="button" id="export-button">最新のJSONを表示</button>
              <button type="button" class="ghost" id="copy-export">コピー</button>
            </div>
            <p class="helper" id="export-helper" role="status"></p>
          </div>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
