<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IIC Switcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>IIC Switcher</h1>
          <p>IAM Identity Centerのアクセスポータルへ素早くログイン。</p>
        </div>
        <button class="ghost" id="open-all" type="button">全て開く</button>
      </header>

      <section class="card">
        <h2>ポータルを追加</h2>
        <form id="portal-form">
          <label>
            表示名
            <input id="portal-name" name="name" placeholder="例: 本番アカウント" required />
          </label>
          <label>
            アクセスポータルURL
            <input
              id="portal-url"
              name="url"
              placeholder="https://d-xxxxx.awsapps.com/start"
              required
            />
          </label>
          <button type="submit">追加</button>
          <p class="helper" id="form-helper" role="alert"></p>
        </form>
      </section>

      <section class="card list-card">
        <div class="list-header">
          <h2>登録済みポータル</h2>
          <span id="portal-count">0</span>
        </div>
        <ul id="portal-list" class="portal-list"></ul>
        <p id="empty-state" class="empty">まだ登録されていません。</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
