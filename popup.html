<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IIC Switcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>IIC Switcher</h1>
          <p>IAM Identity Centerのアクセスポータルへ素早くログイン。</p>
        </div>
        <button class="ghost" id="open-all" type="button">全て開く</button>
      </header>

      <nav class="tabs" role="tablist" aria-label="ポータル操作">
        <button class="tab-button is-active" id="tab-list" role="tab" aria-selected="true" type="button">
          登録済み
        </button>
        <button class="tab-button" id="tab-add" role="tab" aria-selected="false" type="button">
          追加・編集
        </button>
        <button class="tab-button" id="tab-import" role="tab" aria-selected="false" type="button">
          インポート/エクスポート
        </button>
      </nav>

      <section class="card list-card" id="panel-list" role="tabpanel" aria-labelledby="tab-list">
        <div class="list-header">
          <h2>登録済みポータル</h2>
          <span id="portal-count">0</span>
        </div>
        <ul id="portal-list" class="portal-list"></ul>
        <p id="empty-state" class="empty">まだ登録されていません。</p>
      </section>

      <section class="card" id="panel-form" role="tabpanel" aria-labelledby="tab-add" hidden>
        <h2 id="form-title">ポータルを追加</h2>
        <form id="portal-form">
          <label>
            表示名
            <input id="portal-name" name="name" placeholder="例: 本番アカウント" required />
          </label>
          <label>
            アクセスポータルURL
            <input
              id="portal-url"
              name="url"
              placeholder="例: https://d-xxxxx.awsapps.com/start"
              required
            />
          </label>
          <div class="form-actions">
            <button type="submit" id="submit-button">追加</button>
            <button type="button" class="ghost" id="cancel-edit" hidden>キャンセル</button>
          </div>
          <p class="helper" id="form-helper" role="alert"></p>
        </form>
      </section>

      <section class="card" id="panel-import" role="tabpanel" aria-labelledby="tab-import" hidden>
        <h2>インポート/エクスポート</h2>
        <div class="import-export">
          <div class="import-block">
            <h3>JSONインポート</h3>
            <textarea
              id="import-json"
              placeholder='[{"name":"本番","url":"https://d-xxxxx.awsapps.com/start"}]'
            ></textarea>
            <button type="button" id="import-button">インポート</button>
            <p class="helper" id="import-helper" role="alert"></p>
          </div>
          <div class="export-block">
            <h3>JSONエクスポート</h3>
            <textarea id="export-json" readonly></textarea>
            <div class="form-actions">
              <button type="button" id="export-button">最新のJSONを表示</button>
              <button type="button" class="ghost" id="copy-export">コピー</button>
            </div>
            <p class="helper" id="export-helper" role="status"></p>
          </div>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
