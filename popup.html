<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IIC Switcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>IIC Switcher</h1>
        </div>
        <div class="header-actions">
          <button type="button" class="ghost" id="open-settings">設定を開く</button>
        </div>
      </header>

      <section class="card list-card" id="panel-list">
        <div class="list-header">
          <h2>登録済みポータル</h2>
          <div class="list-actions">
            <span id="portal-count">0</span>
          </div>
        </div>
        <ul id="portal-list" class="portal-list"></ul>
        <p id="empty-state" class="empty">まだ登録されていません。</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
